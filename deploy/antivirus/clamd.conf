Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /run/nimbo-antivirus/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
MaxThreads 1
MaxQueue 4
ConcurrentDatabaseReload no
StreamMaxLength 80M
MaxFileSize 80M
MaxScanSize 160M
MaxRecursion 8
MaxFiles 1000
MaxScanTime 90000
AlertExceedsMax yes
AlertEncrypted yes
HeuristicAlerts yes
ReadTimeout 30
CommandReadTimeout 5
SelfCheck 600
