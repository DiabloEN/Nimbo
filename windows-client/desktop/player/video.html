<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    #player { display: block; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const report = value => window.chrome.webview.postMessage(String(value));
    document.documentElement.lang = params.get('hl') || 'en';
    document.getElementById('player').title = params.get('title') || 'YouTube';
    const id = params.get('id');
    let played = false;
    window.addEventListener('message', event => {
      if (event.origin !== 'https://www.youtube-nocookie.com' ||
          event.source !== document.getElementById('player').contentWindow) return;
      const delta = event.data?.nimboScroll;
      if (Number.isFinite(delta) && delta) report('wheel:' + Math.round(Math.max(-800, Math.min(800, delta))));
    });
    if (/^[a-zA-Z0-9_-]{11}$/.test(id)) {
      const query = new URLSearchParams({
        hl: document.documentElement.lang, autoplay: '1', enablejsapi: '1', playsinline: '1',
        start: String(Math.floor(Math.max(0, Number(params.get('start')) || 0)/1000)), origin: location.origin
      });
      document.getElementById('player').src = 'https://www.youtube-nocookie.com/embed/' + id + '?' + query;
    } else {
      report('error');
    }
    function onYouTubeIframeAPIReady() {
      new YT.Player('player', {
        events: {
          onReady: event => {
            window.startRequestedVideo = () => {
              const ms = Number(params.get('start'));
              if (ms > 0) event.target.seekTo(ms / 1000, true);
              event.target.playVideo();
            };
            report('ready');
          },
          onAutoplayBlocked: () => report('blocked'),
          onError: event => report('error:' + event.data),
          onStateChange: event => {
            if (event.data === YT.PlayerState.PLAYING) {
              if (!played) report('playing');
              played = true;
            }
            if (played && event.data === YT.PlayerState.PAUSED) report('pause:' + Math.round(event.target.getCurrentTime() * 1000));
            if (event.data === YT.PlayerState.ENDED) report('ended');
          }
        }
      });
    }
  </script>
  <script src="https://www.youtube.com/iframe_api" onerror="report('error')"></script>
</body>
</html>
