Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /run/nimbo-antivirus/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
MaxThreads 2
MaxQueue 4
ConcurrentDatabaseReload no
StreamMaxLength 20M
MaxFileSize 20M
MaxScanSize 80M
MaxRecursion 8
MaxFiles 1000
MaxScanTime 45000
AlertExceedsMax yes
AlertEncrypted yes
HeuristicAlerts yes
ReadTimeout 30
CommandReadTimeout 5
SelfCheck 600
